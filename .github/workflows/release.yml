name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run model:download
      - run: npm run verify
      - run: npm run make:mac
      - run: npm run size:check
      - uses: actions/upload-artifact@v4
        with: { name: tasko-macos, path: release/* }
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run model:download
      - run: npm run verify
      - run: npm run make:windows
      - run: npm run size:check
      - uses: actions/upload-artifact@v4
        with: { name: tasko-windows, path: release/* }
